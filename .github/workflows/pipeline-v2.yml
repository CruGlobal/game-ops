# The v2 build-once / promote-the-artifact pipeline (ECS).
#
# One environment-neutral image is built from `main` and every environment
# deploys THAT EXACT ARTIFACT, pinned by digest. There is no per-environment
# build any more, and there is deliberately NO `push:` trigger here: merging to
# `main` no longer deploys anything, to stage or to production.
#
# Cadence: nightly-if-changed. The scheduled run builds the tip of main once a
# day; the build's no-change guard reuses the existing candidate when main
# hasn't moved, and deploy-candidate no-ops when release-candidate already runs
# that digest — so a quiet night is a true end-to-end no-op. workflow_dispatch
# builds on demand with the same semantics: an already-built sha is reused
# rather than rebuilt, and a force redeploy lives on cru-deploy's
# `Deploy Candidate (v2)` dispatch, not here.
#
# Production ships only on a manual promote in cru-deploy; the nightly candidate
# never touches production.
#
# The whole v2 fleet builds at 05:00 UTC — midnight EST, 1am EDT. 05:00 UTC is
# off-peak on GitHub's scheduler, so dispatch lag is minimal. Scheduled dispatch
# is still best-effort; a few minutes of lateness is expected, not a failure.
#
# Stage sleeps nightly (`stop_schedule` at 5 PM ET) with no scheduled scale-up,
# so a nightly candidate lands on a stopped service and looks like it did
# nothing. That is expected — start stage with the `cru` CLI before verifying.
# The app runs a single service with in-process cron, so it never scales past 1.
#
# Pinned to the released `v2` tag of CruGlobal/.github (both the reusable
# workflow and the actions) and passes workflow-ref: v2 so the actions the
# reusable workflow checks out match. `v2` tracks the latest v2.x release.
name: Pipeline v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    name: Build candidate
    uses: CruGlobal/.github/.github/workflows/build-candidate.yml@v2
    # build-candidate's ecs job authenticates to AWS via OIDC (the app's
    # prod GitHubRole), so the caller must grant id-token: write — a reusable
    # workflow can only downgrade, never elevate, the caller's permissions.
    permissions:
      id-token: write
      contents: read
    with:
      workflow-ref: v2
      type: ecs
    # BUILD-time secrets are repo secrets named BUILD_<NAME>: inherit hands them
    # to the reusable workflow, which exports ONLY the BUILD_* keys into the
    # build environment (prefix stripped). Runtime secrets are unaffected —
    # those stay in SSM and are refreshed on every deploy.
    secrets: inherit

  deploy-release-candidate:
    name: Deploy to release-candidate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: CruGlobal/.github/actions/dispatch@v2
        with:
          github-token: ${{ secrets.CRU_DEPLOY_GITHUB_TOKEN }}
          workflow: deploy-candidate.yml
          inputs-json: >-
            {"project-name": "${{ needs.build.outputs.project-name }}",
             "tag": "${{ needs.build.outputs.candidate }}"}
