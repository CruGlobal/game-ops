name: Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest

    services:
      # Credentials and database name must match DATABASE_URL in app/.env.test,
      # which the Jest setup loads directly.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gameops
          POSTGRES_PASSWORD: gameops
          POSTGRES_DB: game_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameops -d game_ops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: app

    env:
      DATABASE_URL: postgresql://gameops:gameops@localhost:5432/game_ops_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # `prisma migrate deploy` is deliberately not used: prisma/migrations lags
      # schema.prisma (no migration creates app_settings or challenges.challenge_category),
      # so a migrated database is missing tables the suite needs.
      # Prisma 7 removed --skip-generate from `db push`; the command no longer
      # generates the client at all, so the explicit generate step above is
      # what produces it.
      - name: Create test schema
        run: npx prisma db push

      - name: Run tests
        run: npm test
